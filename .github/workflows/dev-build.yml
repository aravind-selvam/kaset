name: Personal build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out selected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Run unit tests
        run: swift test -q --skip KasetUITests --disable-xctest --no-parallel

      - name: Build isolated personal app
        env:
          KASET_PERSONAL_BUILD: "1"
          KASET_SIGNING: adhoc
          ARCHES: arm64
        run: Scripts/build-app.sh debug

      - name: Verify identity and package
        run: |
          APP=.build/app/Kaset.app
          PLIST="$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = 'com.aravindselvam.kaset.personal.debug'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")" = 'Kaset Personal'
          test "$(/usr/libexec/PlistBuddy -c 'Print :KasetPersonalBuild' "$PLIST")" = 'true'
          ! /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$PLIST" 2>/dev/null
          ! /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$PLIST" 2>/dev/null
          codesign --verify --deep --strict "$APP"
          mkdir -p personal-artifact
          ditto "$APP" 'personal-artifact/Kaset Personal.app'
          cp LICENSE personal-artifact/LICENSE.txt
          ditto -c -k --sequesterRsrc --keepParent personal-artifact Kaset-Personal.zip

      - name: Upload personal app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: Kaset-Personal
          path: Kaset-Personal.zip
          retention-days: 14
